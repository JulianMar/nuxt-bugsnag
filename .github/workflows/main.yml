name: Test Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dev:prepare
      - run: npm run coverage
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
